<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NSE Stock Screener - Mobile</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f5f5f5;
            color: #333;
        }
        
        #root {
            min-height: 100vh;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <script type="text/babel">
        const NSEScreener = () => {
          const [universe, setUniverse] = React.useState([
            'RELIANCE.NS', 'INFY.NS', 'TCS.NS', 'HDFC.NS', 'ICICIBANK.NS',
            'SBIN.NS', 'MARUTI.NS', 'BAJAJ-AUTO.NS', 'WIPRO.NS', 'ADANIPORTS.NS'
          ]);
          
          const [thresholds, setThresholds] = React.useState({
            pe_max: 25,
            pb_max: 3.0
          });

          const [scanning, setScanning] = React.useState(false);
          const [results, setResults] = React.useState(null);
          const [viewMode, setViewMode] = React.useState('results');
          const [selectedMatch, setSelectedMatch] = React.useState(null);

          const BEAR_CASE_LIBRARY = {
            PE_LOW: '⚠️ Low PE may indicate market undervalues fundamentals or expects earnings decline.',
            PB_LOW: '⚠️ Low PB could signal structural challenges or investor skepticism about asset quality.',
          };

          // Fetch REAL stock data from Yahoo Finance
          const fetchStockData = async (ticker) => {
            try {
              const response = await fetch(
                `https://query1.finance.yahoo.com/v10/finance/quoteSummary/${ticker}?modules=financialData,defaultKeyStatistics,price`,
                { 
                  headers: { 'User-Agent': 'Mozilla/5.0' },
                  method: 'GET'
                }
              );
              
              if (!response.ok) throw new Error('API error');
              
              const data = await response.json();
              const result = data.quoteSummary?.result?.[0];
              
              if (!result) throw new Error('No result');

              const price = result.price?.regularMarketPrice?.raw;
              const pe = result.defaultKeyStatistics?.trailingPE?.raw;
              const pb = result.defaultKeyStatistics?.priceToBook?.raw;

              if (!price) throw new Error('No price');

              return {
                ticker,
                price: price || 0,
                pe: pe || null,
                pb: pb || null,
                data_available: true
              };
            } catch (err) {
              console.error(`Error fetching ${ticker}:`, err);
              return null;
            }
          };

          const screenStock = (ticker, stockData) => {
            if (!stockData || !stockData.data_available) return null;

            const criteria = [];

            if (stockData.pe && stockData.pe <= thresholds.pe_max) {
              criteria.push(`PE ${stockData.pe.toFixed(1)} ≤ ${thresholds.pe_max}`);
            }

            if (stockData.pb && stockData.pb <= thresholds.pb_max) {
              criteria.push(`PB ${stockData.pb.toFixed(2)} ≤ ${thresholds.pb_max}`);
            }

            if (criteria.length === 0) return null;

            const bearPoints = [];
            if (stockData.pe && stockData.pe < 15) bearPoints.push(BEAR_CASE_LIBRARY.PE_LOW);
            if (stockData.pb && stockData.pb < 1.5) bearPoints.push(BEAR_CASE_LIBRARY.PB_LOW);

            return {
              ticker,
              price: stockData.price,
              pe_ratio: stockData.pe,
              pb_ratio: stockData.pb,
              matching_criteria: criteria,
              match_count: criteria.length,
              bear_case: bearPoints.slice(0, 2)
            };
          };

          // Run screening with REAL data
          const runScreening = async () => {
            setScanning(true);
            setViewMode('results');

            try {
              const matches = [];
              let processed = 0;

              for (const ticker of universe) {
                try {
                  const stockData = await fetchStockData(ticker);
                  processed++;
                  
                  if (stockData && stockData.data_available) {
                    const match = screenStock(ticker, stockData);
                    if (match) matches.push(match);
                  }
                  
                  await new Promise(r => setTimeout(r, 400));
                } catch (err) {
                  console.error(`Failed: ${ticker}`);
                }
              }

              matches.sort((a, b) => b.match_count - a.match_count);

              setResults({
                timestamp: new Date().toLocaleString(),
                matches,
                total_screened: universe.length,
                total_processed: processed,
                match_count: matches.length
              });

            } catch (err) {
              console.error('Screening error:', err);
            } finally {
              setScanning(false);
            }
          };

          // Send to Telegram
          const sendToTelegram = async (match) => {
            const token = localStorage.getItem('telegram_token');
            const chatId = localStorage.getItem('telegram_chat_id');

            if (!token || !chatId) {
              alert('Configure Telegram in Settings first');
              return;
            }

            try {
              const message = formatAlertMessage(match);
              const url = `https://api.telegram.org/bot${token}/sendMessage`;
              
              const response = await fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                  chat_id: chatId,
                  text: message,
                  parse_mode: 'Markdown'
                })
              });

              if (response.ok) {
                alert('✓ Sent to Telegram');
              } else {
                alert('Failed. Check credentials.');
              }
            } catch (err) {
              alert('Error: ' + err.message);
            }
          };

          const formatAlertMessage = (match) => {
            let msg = `📊 *SCREEN MATCH: ${match.ticker}*\n`;
            msg += `Price: ₹${match.price?.toFixed(2) || 'N/A'}\n`;
            msg += `Timestamp: ${new Date().toLocaleString()}\n\n`;

            msg += `*✅ Bull Case:*\n`;
            match.matching_criteria.forEach(c => {
              msg += `  • ${c}\n`;
            });

            if (match.bear_case?.length > 0) {
              msg += `\n*⚠️ Bear Case:*\n`;
              match.bear_case.forEach(b => {
                msg += `  ${b}\n`;
              });
            }

            msg += `\n*⚠️ RESEARCH ONLY:* This is mechanical screening for research. Not a buy/sell recommendation.\n`;
            msg += `\nScreen Run: ${new Date().toLocaleString()}`;

            return msg;
          };

          // Settings View
          const SettingsView = () => (
            <div style={styles.container}>
              <h2>⚙️ Settings</h2>

              <div style={styles.section}>
                <h3>Stock Universe</h3>
                <textarea
                  value={universe.join('\n')}
                  onChange={(e) => setUniverse(e.target.value.split('\n').filter(x => x))}
                  style={styles.textarea}
                  placeholder="Add NSE tickers (one per line)"
                />
              </div>

              <div style={styles.section}>
                <h3>Screening Thresholds</h3>
                
                <div style={styles.threshold}>
                  <label>PE Ratio Max:</label>
                  <input
                    type="number"
                    value={thresholds.pe_max}
                    onChange={(e) => setThresholds({...thresholds, pe_max: parseFloat(e.target.value)})}
                    style={styles.input}
                  />
                </div>

                <div style={styles.threshold}>
                  <label>PB Ratio Max:</label>
                  <input
                    type="number"
                    value={thresholds.pb_max}
                    onChange={(e) => setThresholds({...thresholds, pb_max: parseFloat(e.target.value)})}
                    style={styles.input}
                  />
                </div>
              </div>

              <div style={styles.section}>
                <h3>Telegram Alerts (Optional)</h3>
                <input
                  type="text"
                  placeholder="Bot Token"
                  defaultValue={localStorage.getItem('telegram_token') || ''}
                  onChange={(e) => localStorage.setItem('telegram_token', e.target.value)}
                  style={styles.input}
                />
                <input
                  type="text"
                  placeholder="Chat ID"
                  defaultValue={localStorage.getItem('telegram_chat_id') || ''}
                  onChange={(e) => localStorage.setItem('telegram_chat_id', e.target.value)}
                  style={styles.input}
                />
                <small>Get from @BotFather on Telegram</small>
              </div>

              <button onClick={() => setViewMode('results')} style={styles.buttonSecondary}>
                ← Back
              </button>
            </div>
          );

          // Details View
          const DetailsView = () => {
            if (!selectedMatch) return null;
            
            return (
              <div style={styles.container}>
                <div style={styles.detailHeader}>
                  <button onClick={() => setViewMode('results')} style={styles.backButton}>←</button>
                  <h2>{selectedMatch.ticker}</h2>
                </div>

                <div style={styles.detailCard}>
                  <div style={styles.detailRow}>
                    <span>Price:</span>
                    <strong>₹{selectedMatch.price?.toFixed(2)}</strong>
                  </div>
                  {selectedMatch.pe_ratio && (
                    <div style={styles.detailRow}>
                      <span>PE Ratio:</span>
                      <strong>{selectedMatch.pe_ratio.toFixed(2)}</strong>
                    </div>
                  )}
                  {selectedMatch.pb_ratio && (
                    <div style={styles.detailRow}>
                      <span>PB Ratio:</span>
                      <strong>{selectedMatch.pb_ratio.toFixed(2)}</strong>
                    </div>
                  )}
                </div>

                <div style={styles.caseSection}>
                  <h3>✅ Bull Case</h3>
                  {selectedMatch.matching_criteria.map((c, i) => (
                    <div key={i} style={styles.caseItem}>• {c}</div>
                  ))}
                </div>

                {selectedMatch.bear_case?.length > 0 && (
                  <div style={styles.caseSection}>
                    <h3>⚠️ Bear Case</h3>
                    {selectedMatch.bear_case.map((b, i) => (
                      <div key={i} style={styles.caseItem}>{b}</div>
                    ))}
                  </div>
                )}

                <div style={styles.disclaimer}>
                  ⚠️ RESEARCH ONLY: Mechanical screen for research purposes. Not a buy/sell recommendation.
                </div>

                <button
                  onClick={() => sendToTelegram(selectedMatch)}
                  style={styles.buttonPrimary}
                >
                  📤 Send to Telegram
                </button>
              </div>
            );
          };

          // Results View
          const ResultsView = () => (
            <div style={styles.container}>
              <div style={styles.header}>
                <h1>📊 NSE Screener</h1>
                <small>Real NSE data, no desktop</small>
              </div>

              <button
                onClick={runScreening}
                disabled={scanning}
                style={{...styles.buttonPrimary, opacity: scanning ? 0.6 : 1, cursor: scanning ? 'wait' : 'pointer'}}
              >
                {scanning ? '⏳ Screening...' : '🔍 Start Screening'}
              </button>

              {results && (
                <div>
                  <div style={styles.summary}>
                    <div>📈 <strong>{results.match_count}</strong> matches</div>
                    <div>📋 Screened <strong>{results.total_processed}</strong></div>
                    <div>🕐 {results.timestamp}</div>
                  </div>

                  {results.match_count === 0 ? (
                    <div style={styles.noResults}>
                      ✗ No matches this run
                    </div>
                  ) : (
                    <div>
                      {results.matches.map((match) => (
                        <div
                          key={match.ticker}
                          style={styles.matchCard}
                          onClick={() => {
                            setSelectedMatch(match);
                            setViewMode('details');
                          }}
                        >
                          <div style={styles.matchHeader}>
                            <strong>{match.ticker}</strong>
                            <span style={styles.badge}>{match.match_count} criteria</span>
                          </div>
                          <div style={styles.matchPrice}>₹{match.price?.toFixed(2)}</div>
                          <div style={styles.matchCriteria}>
                            {match.matching_criteria.map((c, i) => (
                              <span key={i} style={styles.criteriaTag}>{c}</span>
                            ))}
                          </div>
                        </div>
                      ))}
                    </div>
                  )}
                </div>
              )}

              <div style={styles.footer}>
                <button
                  onClick={() => setViewMode('settings')}
                  style={styles.buttonSecondary}
                >
                  ⚙️ Settings
                </button>
              </div>
            </div>
          );

          const styles = {
            root: {
              minHeight: '100vh',
              backgroundColor: '#f5f5f5',
              fontFamily: '-apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif',
              paddingBottom: 60
            },
            container: {
              maxWidth: '500px',
              margin: '0 auto',
              padding: '15px',
              backgroundColor: '#fff'
            },
            header: {
              textAlign: 'center',
              marginBottom: 30,
              paddingTop: 20
            },
            section: {
              marginBottom: 25,
              paddingBottom: 20,
              borderBottom: '1px solid #eee'
            },
            summary: {
              display: 'grid',
              gridTemplateColumns: '1fr 1fr 1fr',
              gap: '10px',
              margin: '20px 0',
              fontSize: '12px',
              textAlign: 'center'
            },
            matchCard: {
              backgroundColor: '#f9f9f9',
              border: '1px solid #ddd',
              borderRadius: '8px',
              padding: '15px',
              marginBottom: '12px',
              cursor: 'pointer'
            },
            matchHeader: {
              display: 'flex',
              justifyContent: 'space-between',
              alignItems: 'center',
              marginBottom: '8px'
            },
            badge: {
              backgroundColor: '#007AFF',
              color: 'white',
              padding: '2px 8px',
              borderRadius: '4px',
              fontSize: '11px'
            },
            matchPrice: {
              fontSize: '18px',
              fontWeight: 'bold',
              marginBottom: '8px',
              color: '#333'
            },
            matchCriteria: {
              display: 'flex',
              flexWrap: 'wrap',
              gap: '5px'
            },
            criteriaTag: {
              backgroundColor: '#e8f4f8',
              color: '#0066cc',
              padding: '3px 8px',
              borderRadius: '3px',
              fontSize: '11px'
            },
            buttonPrimary: {
              width: '100%',
              padding: '12px',
              backgroundColor: '#007AFF',
              color: 'white',
              border: 'none',
              borderRadius: '8px',
              fontSize: '16px',
              fontWeight: '600',
              cursor: 'pointer',
              marginBottom: '12px'
            },
            buttonSecondary: {
              width: '100%',
              padding: '10px',
              backgroundColor: '#f0f0f0',
              color: '#333',
              border: 'none',
              borderRadius: '8px',
              fontSize: '14px',
              fontWeight: '600',
              cursor: 'pointer'
            },
            backButton: {
              backgroundColor: 'transparent',
              border: 'none',
              fontSize: '20px',
              cursor: 'pointer',
              marginRight: '10px'
            },
            textarea: {
              width: '100%',
              minHeight: '100px',
              padding: '10px',
              border: '1px solid #ddd',
              borderRadius: '6px',
              fontFamily: 'monospace',
              fontSize: '12px',
              marginBottom: '8px'
            },
            input: {
              width: '100%',
              padding: '10px',
              border: '1px solid #ddd',
              borderRadius: '6px',
              fontSize: '14px',
              marginBottom: '8px',
              boxSizing: 'border-box'
            },
            threshold: {
              marginBottom: '12px'
            },
            noResults: {
              textAlign: 'center',
              padding: '30px',
              color: '#999',
              fontSize: '16px'
            },
            footer: {
              position: 'fixed',
              bottom: 0,
              left: 0,
              right: 0,
              padding: '12px 15px',
              backgroundColor: '#fff',
              borderTop: '1px solid #eee',
              maxWidth: '500px',
              margin: '0 auto'
            },
            detailHeader: {
              display: 'flex',
              alignItems: 'center',
              marginBottom: '20px'
            },
            detailCard: {
              backgroundColor: '#f9f9f9',
              padding: '15px',
              borderRadius: '8px',
              marginBottom: '20px'
            },
            detailRow: {
              display: 'flex',
              justifyContent: 'space-between',
              padding: '8px 0',
              fontSize: '14px'
            },
            caseSection: {
              marginBottom: '20px',
              paddingBottom: '15px',
              borderBottom: '1px solid #eee'
            },
            caseItem: {
              fontSize: '13px',
              lineHeight: '1.6',
              marginBottom: '8px',
              color: '#333'
            },
            disclaimer: {
              backgroundColor: '#fff3cd',
              color: '#856404',
              padding: '12px',
              borderRadius: '6px',
              fontSize: '12px',
              marginBottom: '15px',
              lineHeight: '1.5'
            }
          };

          return (
            <div style={styles.root}>
              {viewMode === 'results' && <ResultsView />}
              {viewMode === 'settings' && <SettingsView />}
              {viewMode === 'details' && <DetailsView />}
            </div>
          );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<NSEScreener />);
    </script>
</body>
</html>
